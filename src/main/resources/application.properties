spring.application.name=api-gateway
server.port=8000

resilience4j.circuitbreaker.instances.catalogApiCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.catalogApiCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.catalogApiCircuitBreaker.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.catalogApiCircuitBreaker.record-exceptions[0]=java.net.ConnectException

resilience4j.circuitbreaker.instances.searchApiCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.searchApiCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.searchApiCircuitBreaker.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.searchApiCircuitBreaker.record-exceptions[0]=java.net.ConnectException


# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.microcrafts.gateway=TRACE

# Log file paths
logging.file.name=logs/application.log
logging.file.path=logs

# Console logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# File logging pattern
logging.pattern.file=